name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (Tauri / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui

      # The Tauri build script needs the frontend output to exist.
      - run: npm run build
        working-directory: ui

      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes `bindings_up_to_date`: fails when ui/src/bindings.ts is stale (run `just bindings`).
      - name: tests
        run: cargo test --workspace

      - name: svelte-check + tsc
        run: npm run check
        working-directory: ui
      - name: eslint
        run: npm run lint
        working-directory: ui
      - name: prettier
        run: npm run fmt:check
        working-directory: ui
      - name: vitest
        run: npm test
        working-directory: ui
      - name: i18n keys up to date
        run: node scripts/i18n.mjs --check
